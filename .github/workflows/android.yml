name: Android

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    tags: ['android-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint, and assemble debug APKs
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Verify both ABI APKs
        run: |
          test -s android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          test -s android/app/build/outputs/apk/debug/app-x86_64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: |
            android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            android/app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error

  release:
    name: Build signed Android release APKs
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - name: Require expected signing certificate
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          # Repository variable: public certificate SHA-256, hex or colon-separated bytes.
          fingerprint_pattern='^([[:xdigit:]]{64}|([[:xdigit:]]{2}:){31}[[:xdigit:]]{2})$'
          if [[ ! ${ANDROID_SIGNING_CERT_SHA256:-} =~ $fingerprint_pattern ]]; then
            echo '::error::Set repository variable ANDROID_SIGNING_CERT_SHA256 to the expected public certificate SHA-256 (64 hex digits or 32 colon-separated bytes).'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Assemble signed release APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +x
          umask 077
          keystore_dir=$(mktemp -d "$RUNNER_TEMP/android-keystore.XXXXXXXXXX")
          trap 'rm -rf -- "$keystore_dir"' EXIT
          export ANDROID_KEYSTORE_PATH="$keystore_dir/release.keystore"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          test -s "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleRelease
      - name: Verify signed APKs and tag version
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          fingerprint_pattern='^([[:xdigit:]]{64}|([[:xdigit:]]{2}:){31}[[:xdigit:]]{2})$'
          [[ ${ANDROID_SIGNING_CERT_SHA256:-} =~ $fingerprint_pattern ]]
          expected_digest=${ANDROID_SIGNING_CERT_SHA256//:/}
          expected_digest=${expected_digest,,}
          [[ $GITHUB_REF_NAME == android-v* ]]
          version=${GITHUB_REF_NAME#android-v}
          test -n "$version"
          package_pattern="^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'( |$)"
          version_code=''
          for abi in arm64-v8a x86_64; do
            apk="android/app/build/outputs/apk/release/app-$abi-release.apk"
            test -s "$apk"
            signer_output=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")
            signer_count=$(awk '/^Number of signers: / { print substr($0, 20) }' <<< "$signer_output")
            [[ $signer_count == 1 ]]
            mapfile -t signer_digests < <(awk '/^Signer #[0-9]+ certificate SHA-256 digest: / { sub(/^[^:]+: /, ""); print }' <<< "$signer_output")
            [[ ${#signer_digests[@]} == 1 ]]
            signer_digest=${signer_digests[0]}
            [[ $signer_digest =~ $fingerprint_pattern ]]
            signer_digest=${signer_digest//:/}
            [[ ${signer_digest,,} == "$expected_digest" ]]

            badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
            package=$(awk '/^package:/ { print }' <<< "$badging")
            [[ $package =~ $package_pattern ]]
            [[ ${BASH_REMATCH[1]} == io.github.stevenzektyramadhan.isle ]]
            apk_version_code=${BASH_REMATCH[2]}
            apk_version=${BASH_REMATCH[3]}
            [[ $apk_version == "$version" ]]
            [[ $apk_version_code =~ ^[1-9][0-9]*$ ]]
            if [[ -z $version_code ]]; then
              version_code=$apk_version_code
            fi
            [[ $apk_version_code == "$version_code" ]]
            native_code=$(awk '/^native-code:/ { sub(/[[:space:]]+$/, ""); print }' <<< "$badging")
            [[ $native_code == "native-code: '$abi'" ]]
          done
          # Equality and positivity do not establish historical versionCode monotonicity.
          # Before pushing a tag, maintainers must check that this versionCode exceeds
          # every previously distributed release for this package and certificate.
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-release-apks
          path: |
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error

  publish:
    name: Publish signed Android release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-signed-release-apks
          path: dist
      - name: Create signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s dist/app-arm64-v8a-release.apk
          test -s dist/app-x86_64-release.apk
          gh release create "$GITHUB_REF_NAME" \
            dist/app-arm64-v8a-release.apk dist/app-x86_64-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME (signed release)" \
            --notes 'Signed release APKs. Device testing is deferred.'
