name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: build (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --locked
      - name: Verify the binary has no dynamic CRT dependency
        shell: pwsh
        run: |
          $text = [System.Text.Encoding]::ASCII.GetString(
            [System.IO.File]::ReadAllBytes("target/release/isle.exe"))
          foreach ($dll in @("VCRUNTIME140.dll", "VCRUNTIME140_1.dll", "MSVCP140.dll")) {
            if ($text.Contains($dll)) {
              throw "isle.exe still imports $dll; the static CRT setting is not applied"
            }
          }
          "isle.exe has no dynamic CRT import"
      - name: Download yt-dlp.exe and verify checksum
        shell: pwsh
        run: |
          $base = "https://github.com/yt-dlp/yt-dlp/releases/latest/download"
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile yt-dlp.exe
          Invoke-WebRequest "$base/SHA2-256SUMS" -OutFile SHA2-256SUMS
          $expected = (Select-String -Path SHA2-256SUMS -Pattern '\s\*?yt-dlp\.exe$').Line.Split(' ')[0]
          $actual = (Get-FileHash yt-dlp.exe -Algorithm SHA256).Hash.ToLower()
          if ($expected.ToLower() -ne $actual) { throw "yt-dlp.exe checksum mismatch" }
          ./yt-dlp.exe --version
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\isle.iss"
      - name: Assemble portable bundle
        shell: pwsh
        run: |
          $dir = "isle-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/isle.exe $dir/
          Copy-Item yt-dlp.exe $dir/
          Copy-Item README.txt $dir/
          Compress-Archive -Path $dir -DestinationPath "isle-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: isle-windows-x64
          path: isle-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: isle-windows-setup
          path: dist/Isle-Setup-x64.exe
          if-no-files-found: error

  linux:
    name: build (linux-x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev libxkbcommon-dev
      - name: cargo build --release
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir isle-linux-x64
          cp target/release/isle LICENSE isle-linux-x64/
          tar -czf isle-linux-x64.tar.gz isle-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: isle-linux-x64
          path: isle-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
